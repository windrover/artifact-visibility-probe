name: artifact-visibility-probe

# How long does a freshly finalized `github-pages` artifact stay invisible to
# actions/deploy-pages (which lists the run's artifacts through the Actions artifact service)?
#
# Each run uploads a ~1.9 MB artifact, then retries the deploy at doubling offsets
# (0s, +1s, +3s, +7s, +15s, +31s, +63s). The first attempt whose lookup succeeds stops the chain;
# its log timestamp minus the upload's finalize timestamp is the measured visibility lag.
#
# Context: actions/deploy-pages#451, actions/download-artifact#505

on:
  workflow_dispatch:
    inputs:
      payload_bytes:
        description: 'size of the random payload file (bytes)'
        required: false
        default: '1900000'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build payload (~1.9 MB, matches the failing Pages artifact size)
        env:
          PAYLOAD_BYTES: ${{ inputs.payload_bytes }}
        run: |
          head -c "$PAYLOAD_BYTES" /dev/urandom > site/blob.bin
          ls -l site/

      - name: Upload Pages artifact (same action as production)
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy attempt 1 (immediately after finalize)
        id: a1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 1s
        if: steps.a1.outcome == 'failure'
        run: sleep 1

      - name: Deploy attempt 2 (+1s)
        id: a2
        if: steps.a1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 2s
        if: steps.a2.outcome == 'failure'
        run: sleep 2

      - name: Deploy attempt 3 (+3s)
        id: a3
        if: steps.a2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 4s
        if: steps.a3.outcome == 'failure'
        run: sleep 4

      - name: Deploy attempt 4 (+7s)
        id: a4
        if: steps.a3.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 8s
        if: steps.a4.outcome == 'failure'
        run: sleep 8

      - name: Deploy attempt 5 (+15s)
        id: a5
        if: steps.a4.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 16s
        if: steps.a5.outcome == 'failure'
        run: sleep 16

      - name: Deploy attempt 6 (+31s)
        id: a6
        if: steps.a5.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 32s
        if: steps.a6.outcome == 'failure'
        run: sleep 32

      - name: Deploy attempt 7 (+63s)
        id: a7
        if: steps.a6.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Summarize
        if: always()
        run: |
          echo "attempt1(0s)=${{ steps.a1.outcome }} attempt2(+1s)=${{ steps.a2.outcome }} attempt3(+3s)=${{ steps.a3.outcome }} attempt4(+7s)=${{ steps.a4.outcome }} attempt5(+15s)=${{ steps.a5.outcome }} attempt6(+31s)=${{ steps.a6.outcome }} attempt7(+63s)=${{ steps.a7.outcome }}"
          echo "upload_artifact_id=${{ steps.upload.outputs.artifact_id }}"
